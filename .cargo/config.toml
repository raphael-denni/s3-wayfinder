[target.'cfg(target_os = "linux")']
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.x86_64-pc-windows-gnullvm]
rustflags = ["-C", "link-arg=-lunwind"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 3

[profile.debugging]
inherits = "dev"
debug = true

[profile.debugging.package."*"]
debug = true
opt-level = 0
