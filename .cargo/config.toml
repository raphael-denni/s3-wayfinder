# cargo-features = ["codegen-backend"] # nightly only, put it at top of Cargo.toml

# [build]
# rustflags = "-Zthreads=8" # nightly only

[target.'cfg(target_os = "linux")']
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3

[profile.dev]
debug = "line-tables-only"
# codegen-backend = "cranelift" # nightly only

[profile.dev.package."*"]
debug = false
opt-level = 3

[profile.debugging]
inherits = "dev"
debug = true

[profile.debugging.package."*"]
debug = true
opt-level = 0
