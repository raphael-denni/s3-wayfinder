name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Release (Linux x64)
    runs-on: codeberg-medium-lazy
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.forgejo/actions/setup-rust
        with:
          packages: libssl-dev pkg-config zip mold

      - name: Build Release
        run: cargo build --verbose --release

      - name: Package (Linux)
        run: |
          set -eu
          VERSION=${{ forgejo.ref_name }}
          VERSION=${VERSION#v}
          mkdir -p dist
          cp target/release/s3wf dist/s3wf
          cd dist && zip ../s3wf-${VERSION}-linux-x64.zip s3wf

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: s3wf-linux-x64
          path: s3wf-*-linux-x64.zip

  build-windows:
    name: Build Release (Windows x64)
    runs-on: codeberg-medium-lazy
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.forgejo/actions/setup-rust
        with:
          targets: x86_64-pc-windows-gnu
          packages: mingw-w64 zip

      - name: Build Release (Windows)
        run: cargo build --verbose --release --target x86_64-pc-windows-gnu

      - name: Package (Windows)
        run: |
          set -eu
          VERSION=${{ forgejo.ref_name }}
          VERSION=${VERSION#v}
          mkdir -p dist
          cp target/x86_64-pc-windows-gnu/release/s3wf.exe dist/s3wf.exe
          cd dist && zip ../s3wf-${VERSION}-windows-x64.zip s3wf.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: s3wf-windows-x64
          path: s3wf-*-windows-x64.zip

  publish:
    name: Publish Release
    needs: [build-linux, build-windows]
    runs-on: codeberg-tiny-lazy
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate a release notes
        uses: https://github.com/orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --current
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Strip version header
        run: sed -i -e '1{/^## /d}' -e '/./,$!d' RELEASE_NOTES.md

      - name: Download Linux Artifact
        uses: actions/download-artifact@v3
        with:
          name: s3wf-linux-x64
          path: assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v3
        with:
          name: s3wf-windows-x64
          path: assets

      - name: Verify Release Assets
        run: |
          set -eu
          VERSION="${{ forgejo.ref_name }}"
          VERSION="${VERSION#v}"

          ls -lh assets
          test -s "assets/s3wf-${VERSION}-linux-x64.zip"
          test -s "assets/s3wf-${VERSION}-windows-x64.zip"

      - name: Create Release
        uses: actions/forgejo-release@v2
        with:
          direction: upload
          release-dir: assets
          token: ${{ forgejo.token }}
          release-notes-file: RELEASE_NOTES.md
          prerelease: ${{ startsWith(forgejo.ref_name, 'v0.') || contains(forgejo.ref_name, '-rc') }}
