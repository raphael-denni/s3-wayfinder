name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Release (Linux x64)
    runs-on: codeberg-medium-lazy
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.forgejo/actions/setup-rust
        with:
          packages: libssl-dev pkg-config zip mold

      - name: Build Release
        run: cargo build --verbose --release

      - name: Package (Linux)
        run: |
          set -eu
          VERSION=${{ forgejo.ref_name }}
          VERSION=${VERSION#v}
          zip -j s3wf-${VERSION}-linux-x64.zip target/release/s3wf

      - name: Upload Artifact
        uses: https://data.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: s3wf-linux-x64
          path: s3wf-*-linux-x64.zip

  build-windows:
    name: Build Release (Windows x64)
    runs-on: codeberg-medium-lazy
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.forgejo/actions/setup-rust
        with:
          targets: x86_64-pc-windows-gnullvm
          crates: cargo-zigbuild
          packages: zip

      - name: Install Zig
        uses: https://codeberg.org/mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build Release (Windows)
        run: cargo zigbuild --verbose --release --target x86_64-pc-windows-gnullvm

      - name: Package (Windows)
        run: |
          set -eu
          VERSION=${{ forgejo.ref_name }}
          VERSION=${VERSION#v}
          zip -j s3wf-${VERSION}-windows-x64.zip target/x86_64-pc-windows-gnullvm/release/s3wf.exe

      - name: Upload Artifact
        uses: https://data.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: s3wf-windows-x64
          path: s3wf-*-windows-x64.zip

  publish:
    name: Publish Release
    needs: [build-linux, build-windows]
    runs-on: codeberg-tiny-lazy
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate a release notes
        uses: https://github.com/orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --current
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Check & strip version header
        run: |
          test -s RELEASE_NOTES.md
          sed -i -e '1{/^## /d}' -e '/./,$!d' RELEASE_NOTES.md

      - name: Download Artifacts
        uses: https://data.forgejo.org/forgejo/download-artifact@v5
        with:
          path: assets
          merge-multiple: true

      - name: Verify Release Assets
        run: |
          set -eu
          VERSION="${{ forgejo.ref_name }}"
          VERSION="${VERSION#v}"

          ls -lh assets
          test -s "assets/s3wf-${VERSION}-linux-x64.zip"
          test -s "assets/s3wf-${VERSION}-windows-x64.zip"

      - name: Create Release
        uses: actions/forgejo-release@v2
        with:
          direction: upload
          release-dir: assets
          token: ${{ forgejo.token }}
          release-notes-file: RELEASE_NOTES.md
          prerelease: ${{ startsWith(forgejo.ref_name, 'v0.') || contains(forgejo.ref_name, '-rc') }}
