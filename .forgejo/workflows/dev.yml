name: Development

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint & Format
    runs-on: codeberg-small-lazy
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.forgejo/actions/setup-rust
        with:
          components: clippy rustfmt
          packages: libssl-dev pkg-config

      - name: Format Check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  tests:
    name: Test (Linux Dev)
    runs-on: codeberg-small-lazy
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.forgejo/actions/setup-rust
        with:
          packages: libssl-dev pkg-config

      - name: Run Tests
        run: cargo test --verbose
